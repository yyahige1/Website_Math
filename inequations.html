<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathsFacile - Inéquations</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/exercices.css">
    <link rel="stylesheet" href="css/navigation.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎓 Inéquations</h1>
            <p class="subtitle">Exercices interactifs</p>
            <p class="intro">Entraîne-toi à résoudre des inéquations du 1er degré.<br>Clique sur <strong>Correction</strong> pour voir les étapes et la représentation graphique.</p>
        </header>

        <div class="card">
            <div class="type-selector">
                <button class="type-btn active" data-type="type1">
                    <div class="example">ax + b > c</div>
                    <div class="label">Inéquation simple</div>
                </button>
                <button class="type-btn" data-type="type2">
                    <div class="example">ax + b ≤ cx + d</div>
                    <div class="label">Avec x des deux côtés</div>
                </button>
            </div>

            <!-- Coefficients Type 1 -->
            <div class="coefficients" id="coeffType1">
                <div class="coef-group">
                    <label>a</label>
                    <input type="number" id="a1" value="2">
                </div>
                <div class="coef-group">
                    <label>b</label>
                    <input type="number" id="b1" value="3">
                </div>
                <div class="coef-group">
                    <label>signe</label>
                    <select id="sign1">
                        <option value="<">&lt;</option>
                        <option value=">" selected>&gt;</option>
                        <option value="<=">≤</option>
                        <option value=">=">≥</option>
                    </select>
                </div>
                <div class="coef-group">
                    <label>c</label>
                    <input type="number" id="c1" value="7">
                </div>
            </div>

            <!-- Coefficients Type 2 -->
            <div class="coefficients hidden" id="coeffType2">
                <div class="coef-group">
                    <label>a</label>
                    <input type="number" id="a2" value="5">
                </div>
                <div class="coef-group">
                    <label>b</label>
                    <input type="number" id="b2" value="-2">
                </div>
                <div class="coef-group">
                    <label>signe</label>
                    <select id="sign2">
                        <option value="<">&lt;</option>
                        <option value=">">&gt;</option>
                        <option value="<=" selected>≤</option>
                        <option value=">=">≥</option>
                    </select>
                </div>
                <div class="coef-group">
                    <label>c</label>
                    <input type="number" id="c2" value="3">
                </div>
                <div class="coef-group">
                    <label>d</label>
                    <input type="number" id="d2" value="4">
                </div>
            </div>

            <div class="expression-display">
                <div class="expression" id="expressionDisplay">2x + 3 > 7</div>
            </div>

            <div class="action-buttons">
                <button class="btn-generate" id="generateBtn">🎲 Nouveau</button>
                <button class="btn-solve" id="solveBtn">✓ Correction</button>
            </div>

            <div class="solution" id="solutionDiv">
                <h3>📝 Résolution</h3>
                <div id="stepsContainer"></div>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="js/utils.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
    <script src="js/inequations.js"></script>
    <script src="js/navigation.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', initInequationsPage);
    </script>
</body>
</html>
