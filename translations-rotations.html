<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathsFacile - Translations et rotations</title>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/exercices.css">
    <link rel="stylesheet" href="css/navigation.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Translations et rotations</h1>
            <p class="subtitle">Exercices interactifs</p>
            <p class="intro">Entra&icirc;ne-toi sur les transformations g&eacute;om&eacute;triques du plan.</p>
        </header>
        <div class="card">
            <div class="type-selector grid-2">
                <button class="type-btn active" data-type="translation">
                    <div class="example">&rarr;</div>
                    <div class="label">Translation</div>
                </button>
                <button class="type-btn" data-type="rotation">
                    <div class="example">&#x21BB;</div>
                    <div class="label">Rotation</div>
                </button>
            </div>
            <div class="expression-display">
                <div class="expression" id="exerciseDisplay"></div>
            </div>
            <div id="graphSection" style="text-align:center;">
                <canvas id="transCanvas" width="400" height="400" style="max-width:100%;"></canvas>
            </div>
            <div class="action-buttons">
                <button class="btn-generate" id="generateBtn">Nouvel exercice</button>
                <button class="btn-solve" id="solveBtn">Correction</button>
            </div>
        </div>
        <div id="solutionDiv" class="solution card"></div>
    </div>
    <script src="js/utils.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/translations-rotations.js"></script>
</body>
</html>
