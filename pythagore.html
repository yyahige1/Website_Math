<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathsFacile - Theoreme de Pythagore</title>

    <!-- KaTeX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
          integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV"
          crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"
            integrity="sha384-XjKyOOlGwcjNTAIQHIpgOno0Hl1YQqzUOEleOLALmuqehneUG+vnGctmUb0ZY0l8"
            crossorigin="anonymous"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/exercices.css">
    <link rel="stylesheet" href="css/navigation.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Theoreme de Pythagore</h1>
            <p class="subtitle">Niveau : 4eme</p>
            <p class="intro">Entraine-toi au theoreme de Pythagore : calcul de l'hypotenuse, d'un cote, reciproque et problemes.<br>Choisis un type, puis clique sur <strong>Correction</strong>.</p>
        </header>

        <div class="card">
            <div class="type-selector grid-2">
                <button class="type-btn active" data-type="hypotenuse">
                    <div class="example">Trouver BC</div>
                    <div class="label">Hypotenuse</div>
                </button>
                <button class="type-btn" data-type="cote">
                    <div class="example">Trouver AB</div>
                    <div class="label">Cote</div>
                </button>
                <button class="type-btn" data-type="reciproque">
                    <div class="example">Rectangle ?</div>
                    <div class="label">Reciproque</div>
                </button>
                <button class="type-btn" data-type="probleme">
                    <div class="example">Probleme</div>
                    <div class="label">Contextualise</div>
                </button>
            </div>

            <div class="expression-display">
                <div class="expression" id="exerciseDisplay"></div>
                <canvas id="triangleCanvas" width="320" height="260" style="display:block; margin: 12px auto 0;"></canvas>
            </div>

            <div class="action-buttons">
                <button class="btn-generate" id="generateBtn">Nouvel exercice</button>
                <button class="btn-solve" id="solveBtn">Correction</button>
            </div>
        </div>

        <div id="solutionDiv" class="solution card"></div>
    </div>

    <!-- JavaScript -->
    <script src="js/utils.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/pythagore.js"></script>
</body>
</html>
