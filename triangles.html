<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathsFacile - Triangles et parall&eacute;logrammes</title>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/exercices.css">
    <link rel="stylesheet" href="css/navigation.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Triangles et parall&eacute;logrammes</h1>
            <p class="subtitle">Exercices interactifs</p>
            <p class="intro">Entra&icirc;ne-toi sur les propri&eacute;t&eacute;s des triangles et des parall&eacute;logrammes.</p>
        </header>
        <div class="card">
            <div class="type-selector grid-3">
                <button class="type-btn active" data-type="somme-angles">
                    <div class="example">&ang; = 180&deg;</div>
                    <div class="label">Somme des angles</div>
                </button>
                <button class="type-btn" data-type="inegalite">
                    <div class="example">a + b &gt; c</div>
                    <div class="label">In&eacute;galit&eacute; triangulaire</div>
                </button>
                <button class="type-btn" data-type="parallelogramme">
                    <div class="example">&#x25B1;</div>
                    <div class="label">Parall&eacute;logramme</div>
                </button>
            </div>
            <div class="expression-display">
                <div class="expression" id="exerciseDisplay"></div>
            </div>
            <div id="graphSection" style="text-align:center;">
                <canvas id="triCanvas" width="400" height="300" style="max-width:100%;"></canvas>
            </div>
            <div class="action-buttons">
                <button class="btn-generate" id="generateBtn">Nouvel exercice</button>
                <button class="btn-solve" id="solveBtn">Correction</button>
            </div>
        </div>
        <div id="solutionDiv" class="solution card"></div>
    </div>
    <script src="js/utils.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/triangles.js"></script>
</body>
</html>
