<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathsFacile - Nombres et calculs</title>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/exercices.css">
    <link rel="stylesheet" href="css/navigation.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Nombres et calculs</h1>
            <p class="subtitle">Exercices interactifs</p>
            <p class="intro">Entra&icirc;ne-toi sur les op&eacute;rations avec les nombres entiers et d&eacute;cimaux.</p>
        </header>
        <div class="card">
            <div class="type-selector grid-2">
                <button class="type-btn active" data-type="operations">
                    <div class="example">3,5 + 2,8</div>
                    <div class="label">Op&eacute;rations</div>
                </button>
                <button class="type-btn" data-type="comparaison">
                    <div class="example">3,14 &lt; 3,2</div>
                    <div class="label">Comparaison</div>
                </button>
                <button class="type-btn" data-type="arrondis">
                    <div class="example">&asymp; 3,5</div>
                    <div class="label">Arrondis</div>
                </button>
                <button class="type-btn" data-type="ordre-grandeur">
                    <div class="example">&asymp; ?</div>
                    <div class="label">Ordre de grandeur</div>
                </button>
            </div>
            <div class="expression-display">
                <div class="expression" id="exerciseDisplay"></div>
            </div>
            <div class="action-buttons">
                <button class="btn-generate" id="generateBtn">Nouvel exercice</button>
                <button class="btn-solve" id="solveBtn">Correction</button>
            </div>
        </div>
        <div id="solutionDiv" class="solution card"></div>
    </div>
    <script src="js/utils.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/nombres-decimaux.js"></script>
</body>
</html>
