<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathsFacile - Racines carrées</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/exercices.css">
    <link rel="stylesheet" href="css/navigation.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎓 Racines carrées</h1>
            <p class="subtitle">Exercices interactifs</p>
            <p class="intro">Entraîne-toi à simplifier des racines carrées et effectuer des opérations.<br>Clique sur <strong>Correction</strong> pour voir les étapes détaillées.</p>
        </header>

        <div class="card">
            <div class="type-selector grid-3">
                <button class="type-btn active" data-type="1">
                    <div class="example">√72 = ?</div>
                    <div class="label">Simplification</div>
                </button>
                <button class="type-btn" data-type="2">
                    <div class="example">√a + √b</div>
                    <div class="label">Addition</div>
                </button>
                <button class="type-btn" data-type="3">
                    <div class="example">√a × √b</div>
                    <div class="label">Multiplication</div>
                </button>
                <button class="type-btn" data-type="4">
                    <div class="example">1/√a</div>
                    <div class="label">Rationaliser</div>
                </button>
                <button class="type-btn" data-type="5">
                    <div class="example">1/(√a + b)</div>
                    <div class="label">Expression conjuguée</div>
                </button>
                <button class="type-btn" data-type="6">
                    <div class="example">a/(√b + c)</div>
                    <div class="label">Fraction conjuguée</div>
                </button>
            </div>

            <div class="expression-display">
                <div class="expression" id="expressionDisplay">√72</div>
            </div>

            <div class="action-buttons">
                <button class="btn-generate" id="generateBtn">🎲 Nouveau</button>
                <button class="btn-solve" id="solveBtn">✓ Correction</button>
            </div>

            <div class="solution" id="solutionDiv">
                <h3>📝 Résolution</h3>
                <div id="stepsContainer"></div>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="js/utils.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
    <script src="js/racines.js"></script>
    <script src="js/navigation.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', initRacinesPage);
    </script>
</body>
</html>
