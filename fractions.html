<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathsFacile - Fractions</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/exercices.css">
    <link rel="stylesheet" href="css/fractions.css">
    <link rel="stylesheet" href="css/navigation.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎓 Fractions</h1>
            <p class="subtitle">Exercices interactifs</p>
            <p class="intro">Entraîne-toi aux opérations sur les fractions.<br>Choisis une opération, puis clique sur <strong>Correction</strong>.</p>
        </header>

        <div class="card">
            <div class="type-selector grid-2">
                <button class="type-btn active" data-type="addition">
                    <div class="example">a/b + c/d</div>
                    <div class="label">Addition</div>
                </button>
                <button class="type-btn" data-type="soustraction">
                    <div class="example">a/b − c/d</div>
                    <div class="label">Soustraction</div>
                </button>
                <button class="type-btn" data-type="multiplication">
                    <div class="example">a/b × c/d</div>
                    <div class="label">Multiplication</div>
                </button>
                <button class="type-btn" data-type="division">
                    <div class="example">a/b ÷ c/d</div>
                    <div class="label">Division</div>
                </button>
                <button class="type-btn" data-type="simplification">
                    <div class="example">12/18 = ?</div>
                    <div class="label">Simplification</div>
                </button>
            </div>

            <!-- Inputs fractions -->
            <div class="fraction-inputs">
                <div class="fraction-group">
                    <label id="fraction1Label">Fraction 1</label>
                    <div class="fraction-input-box">
                        <input type="number" id="num1" value="2" placeholder="num">
                        <div class="fraction-bar"></div>
                        <input type="number" id="den1" value="3" placeholder="den" min="1">
                    </div>
                </div>

                <div class="fraction-group" id="fraction2Group">
                    <label>Fraction 2</label>
                    <div class="fraction-input-box">
                        <input type="number" id="num2" value="1" placeholder="num">
                        <div class="fraction-bar"></div>
                        <input type="number" id="den2" value="4" placeholder="den" min="1">
                    </div>
                </div>
            </div>

            <div class="expression-display">
                <div class="expression" id="expressionDisplay"></div>
            </div>

            <div class="action-buttons">
                <button class="btn-generate" id="generateBtn">🎲 Nouveau</button>
                <button class="btn-solve" id="solveBtn">✓ Correction</button>
            </div>

            <div class="solution" id="solutionDiv">
                <h3>📝 Résolution</h3>
                <div id="stepsContainer"></div>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="js/utils.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
    <script src="js/fractions.js"></script>
    <script src="js/navigation.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', initFractionsPage);
    </script>
</body>
</html>
