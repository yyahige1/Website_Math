<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathsFacile - Réduction</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/exercices.css">
    <link rel="stylesheet" href="css/navigation.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎓 Réduction</h1>
            <p class="subtitle">Exercices interactifs</p>
            <p class="intro">Entraîne-toi à réduire des expressions algébriques.<br>Clique sur <strong>Correction</strong> pour voir le regroupement des termes.</p>
        </header>

        <div class="card">
            <div class="type-selector">
                <button class="type-btn active" data-type="avec-x">
                    <div class="example">4x + 7 − 2x + 3</div>
                    <div class="label">Termes en x et nombres</div>
                </button>
                <button class="type-btn" data-type="avec-x2">
                    <div class="example">2x² + 3x − x² + 5</div>
                    <div class="label">Avec x²</div>
                </button>
                <button class="type-btn" data-type="avec-parentheses">
                    <div class="example">2(x + 3) + 5x − 4</div>
                    <div class="label">Avec parenthèses</div>
                </button>
            </div>

            <!-- Nombre de termes -->
            <div class="coefficients">
                <div class="coef-group">
                    <label>Nombre de termes</label>
                    <select id="nbTerms">
                        <option value="3">3</option>
                        <option value="4" selected>4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                    </select>
                </div>
            </div>

            <div class="expression-display">
                <div class="expression" id="expressionDisplay">4x + 7 − 2x + 3</div>
            </div>

            <div class="action-buttons">
                <button class="btn-generate" id="generateBtn">🎲 Nouveau</button>
                <button class="btn-solve" id="solveBtn">✓ Correction</button>
            </div>

            <div class="solution" id="solutionDiv">
                <h3>📝 Réduction</h3>
                <div id="stepsContainer"></div>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="js/utils.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
    <script src="js/reduction.js"></script>
    <script src="js/navigation.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', initReductionPage);
    </script>
</body>
</html>
