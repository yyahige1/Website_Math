<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathsFacile - Proportionnalit&eacute;</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/exercices.css">
    <link rel="stylesheet" href="css/navigation.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Proportionnalit&eacute;</h1>
            <p class="subtitle">Exercices interactifs</p>
            <p class="intro">Entra&icirc;ne-toi &agrave; reconna&icirc;tre et utiliser la proportionnalit&eacute;.<br>Choisis un type, puis clique sur <strong>Correction</strong>.</p>
        </header>

        <div class="card">
            <div class="type-selector grid-3">
                <button class="type-btn active" data-type="tableau">
                    <div class="example">? | 6 | 9</div>
                    <div class="label">Compl&eacute;ter un tableau</div>
                </button>
                <button class="type-btn" data-type="coefficient">
                    <div class="example">k = ?</div>
                    <div class="label">Coefficient</div>
                </button>
                <button class="type-btn" data-type="produit-croix">
                    <div class="example">a/b = c/d</div>
                    <div class="label">Produit en croix</div>
                </button>
            </div>

            <div class="expression-display">
                <div class="expression" id="exerciseDisplay"></div>
            </div>

            <div class="action-buttons">
                <button class="btn-generate" id="generateBtn">Nouvel exercice</button>
                <button class="btn-solve" id="solveBtn">Correction</button>
            </div>
        </div>

        <div id="solutionDiv" class="solution card"></div>
    </div>

    <!-- JavaScript -->
    <script src="js/utils.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/proportionnalite.js"></script>
</body>
</html>
