<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathsFacile - Statistiques (Lycee)</title>
    <meta name="description" content="Exercices interactifs sur les statistiques. Programme Seconde, Premiere. Moyenne, mediane, quartiles, variance, ecart-type, regression lineaire.">
    <meta name="keywords" content="statistiques, moyenne, mediane, quartiles, variance, ecart-type, regression, lycee, mathematiques, exercices">

    <!-- KaTeX pour le rendu mathematique -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
          integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV"
          crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"
            integrity="sha384-XjKyOOlGwcjNTAIQHIpgOno0Hl1YQqzUOEleOLALmuqehneUG+vnGctmUb0ZY0l8"
            crossorigin="anonymous"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/exercices.css">
    <link rel="stylesheet" href="css/navigation.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 Statistiques</h1>
            <p class="subtitle">Niveau : Seconde / Premiere</p>
            <p class="intro">Entraine-toi sur les statistiques descriptives.<br>Choisis un type d'exercice, puis clique sur <strong>Correction</strong>.</p>
        </header>

        <div class="card">
            <div class="type-selector grid-3">
                <button class="type-btn active" data-type="moyenne">
                    <div class="example">x&#772; = ...</div>
                    <div class="label">Moyenne</div>
                </button>
                <button class="type-btn" data-type="mediane">
                    <div class="example">Me, Q1, Q3</div>
                    <div class="label">Mediane & Quartiles</div>
                </button>
                <button class="type-btn" data-type="dispersion">
                    <div class="example">V(X), &sigma;</div>
                    <div class="label">Variance & Ecart-type</div>
                </button>
                <button class="type-btn" data-type="boite">
                    <div class="example">|--|====|--|</div>
                    <div class="label">Diagramme en boite</div>
                </button>
                <button class="type-btn" data-type="regression">
                    <div class="example">y = ax + b</div>
                    <div class="label">Regression lineaire</div>
                </button>
            </div>

            <!-- Section Moyenne -->
            <div id="moyenneSection">
                <h3>Moyenne</h3>
                <div class="param-row">
                    <label>Type de donnees :</label>
                    <select id="subtype_moyenne">
                        <option value="simple">Serie simple (liste de valeurs)</option>
                        <option value="ponderee">Serie ponderee (valeurs + effectifs)</option>
                        <option value="classes">Donnees en classes</option>
                    </select>
                </div>
            </div>

            <!-- Section Mediane & Quartiles -->
            <div id="medianeSection" style="display: none;">
                <h3>Mediane & Quartiles</h3>
                <div class="param-row">
                    <label>Type de donnees :</label>
                    <select id="subtype_mediane">
                        <option value="simple">Serie simple</option>
                        <option value="effectifs">Serie avec effectifs</option>
                    </select>
                </div>
            </div>

            <!-- Section Variance & Ecart-type -->
            <div id="dispersionSection" style="display: none;">
                <h3>Variance & Ecart-type</h3>
                <div class="param-row">
                    <label>Type de donnees :</label>
                    <select id="subtype_dispersion">
                        <option value="simple">Serie simple</option>
                        <option value="ponderee">Serie ponderee</option>
                    </select>
                </div>
            </div>

            <!-- Section Diagramme en boite -->
            <div id="boiteSection" style="display: none;">
                <h3>Diagramme en boite</h3>
                <div class="param-row">
                    <label>Type d'exercice :</label>
                    <select id="subtype_boite">
                        <option value="construire">Construire le diagramme</option>
                        <option value="lire">Lire un diagramme</option>
                    </select>
                </div>
            </div>

            <!-- Section Regression lineaire -->
            <div id="regressionSection" style="display: none;">
                <h3>Regression lineaire</h3>
                <div class="param-row">
                    <label>Type d'exercice :</label>
                    <select id="subtype_regression">
                        <option value="equation">Equation de la droite y = ax + b</option>
                        <option value="correlation">Coefficient de correlation</option>
                    </select>
                </div>
            </div>

            <div class="expression-display">
                <div class="expression" id="expressionDisplay"></div>
            </div>

            <div class="action-buttons">
                <button id="newExerciseBtn" class="btn btn-secondary">Nouvel exercice</button>
                <button id="solveBtn" class="btn btn-primary">Correction</button>
            </div>
        </div>

        <!-- Zone de solution -->
        <div id="solutionDiv" class="card solution">
            <h3>Correction detaillee</h3>
            <div id="stepsContainer"></div>
        </div>

        <footer>
            <p>MathsFacile - Statistiques</p>
        </footer>
    </div>

    <!-- JavaScript -->
    <script src="js/utils.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/statistiques.js"></script>
</body>
</html>
