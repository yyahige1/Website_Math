<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathsFacile - Factorisation</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/exercices.css">
    <link rel="stylesheet" href="css/navigation.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎓 Factorisation</h1>
            <p class="subtitle">Exercices interactifs</p>
            <p class="intro">Entraîne-toi à factoriser des expressions.<br>Choisis un type, puis clique sur <strong>Correction</strong>.</p>
        </header>

        <div class="card">
            <div class="type-selector">
                <button class="type-btn active" data-type="facteur-commun">
                    <div class="example">6x + 9 = 3(2x + 3)</div>
                    <div class="label">Facteur commun</div>
                </button>
                <button class="type-btn" data-type="diff-carres">
                    <div class="example">x² − 9 = (x − 3)(x + 3)</div>
                    <div class="label">Différence de carrés : a² − b²</div>
                </button>
                <button class="type-btn" data-type="carre-parfait">
                    <div class="example">x² + 6x + 9 = (x + 3)²</div>
                    <div class="label">Carré parfait : a² ± 2ab + b²</div>
                </button>
            </div>

            <!-- Coefficients Facteur Commun -->
            <div class="coefficients" id="coeffFacteur">
                <div class="coef-info">Expression générée aléatoirement avec un facteur commun</div>
            </div>

            <!-- Coefficients Diff Carrés -->
            <div class="coefficients hidden" id="coeffDiff">
                <div class="coef-group">
                    <label>a (dans ax)</label>
                    <input type="number" id="dc_a" value="1" min="1">
                </div>
                <div class="coef-group">
                    <label>b</label>
                    <input type="number" id="dc_b" value="3" min="1">
                </div>
            </div>

            <!-- Coefficients Carré Parfait -->
            <div class="coefficients hidden" id="coeffCarre">
                <div class="coef-group">
                    <label>a (dans ax)</label>
                    <input type="number" id="cp_a" value="1" min="1">
                </div>
                <div class="coef-group">
                    <label>b</label>
                    <input type="number" id="cp_b" value="3" min="1">
                </div>
                <div class="coef-group">
                    <label>Signe</label>
                    <select id="cp_sign">
                        <option value="+">+</option>
                        <option value="-">−</option>
                    </select>
                </div>
            </div>

            <div class="expression-display">
                <div class="expression" id="expressionDisplay">6x + 9</div>
            </div>

            <div class="action-buttons">
                <button class="btn-generate" id="generateBtn">🎲 Nouveau</button>
                <button class="btn-solve" id="solveBtn">✓ Correction</button>
            </div>

            <div class="solution" id="solutionDiv">
                <h3>📝 Factorisation</h3>
                <div id="stepsContainer"></div>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="js/utils.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
    <script src="js/factorisation.js"></script>
    <script src="js/navigation.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', initFactorisationPage);
    </script>
</body>
</html>
