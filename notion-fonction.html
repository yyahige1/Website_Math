<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathsFacile - Notion de fonction</title>

    <!-- KaTeX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
          integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV"
          crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"
            integrity="sha384-XjKyOOlGwcjNTAIQHIpgOno0Hl1YQqzUOEleOLALmuqehneUG+vnGctmUb0ZY0l8"
            crossorigin="anonymous"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/exercices.css">
    <link rel="stylesheet" href="css/navigation.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Notion de fonction</h1>
            <p class="subtitle">Exercices interactifs</p>
            <p class="intro">Entra&icirc;ne-toi &agrave; lire et utiliser les fonctions.<br>Choisis un type, puis clique sur <strong>Correction</strong>.</p>
        </header>

        <div class="card">
            <div class="type-selector grid-3">
                <button class="type-btn active" data-type="image">
                    <div class="example">f(3) = ?</div>
                    <div class="label">Lire une image</div>
                </button>
                <button class="type-btn" data-type="antecedent">
                    <div class="example">f(x) = 2</div>
                    <div class="label">Lire un ant&eacute;c&eacute;dent</div>
                </button>
                <button class="type-btn" data-type="variations">
                    <div class="example">&nearr; &searr;</div>
                    <div class="label">Variations</div>
                </button>
                <button class="type-btn" data-type="definition">
                    <div class="example">D<sub>f</sub> = ?</div>
                    <div class="label">Ens. de d&eacute;finition</div>
                </button>
                <button class="type-btn" data-type="tableau">
                    <div class="example">x &rarr; f(x)</div>
                    <div class="label">Tableau de valeurs</div>
                </button>
            </div>

            <div class="expression-display">
                <div class="expression" id="exerciseDisplay"></div>
            </div>

            <div id="graphSection" style="text-align:center;">
                <canvas id="nfCanvas" width="500" height="350" style="max-width:100%;"></canvas>
            </div>

            <div class="action-buttons">
                <button class="btn-generate" id="generateBtn">Nouvel exercice</button>
                <button class="btn-solve" id="solveBtn">Correction</button>
            </div>
        </div>

        <div id="solutionDiv" class="solution card"></div>
    </div>

    <!-- JavaScript -->
    <script src="js/utils.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
    <script src="js/graphing.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/notion-fonction.js"></script>
</body>
</html>
